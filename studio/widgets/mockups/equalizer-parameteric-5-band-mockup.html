<!-- Screwed / rack-mounted Equalizer — markup -->
<div class="unit unit--striped ru ru--eq ru--screwed">
      <span class="rail-groove rail-groove--l"></span><span class="rail-groove rail-groove--r"></span><span class="screw screw--tl"></span><span class="screw screw--tr"></span><span class="screw screw--bl"></span><span class="screw screw--br"></span>
      <div class="ru-ear"><button type="button" class="eq-band-power is-on"><span class="eq-band-lamp"></span></button><span class="ru-name">Equalizer</span></div>
      <div class="ru-body ru-body--eq">
        <div class="eqm">
          <div class="eqm-head"><span class="eqm-title">Equalizer</span><span class="unit-note" style="white-space:nowrap">5-band parametric</span><div class="seg-keys" style="margin-left:auto"><button type="button" class="eq-band-power is-on"><span class="eq-band-lamp"></span><span class="eq-band-power-text">On</span></button><button type="button" class="eq-band-power"><span class="eq-band-lamp"></span><span class="eq-band-power-text">Bypass</span></button></div></div>
          <div class="scope eq-curve eqm-scope eqm-scope--tall"><canvas data-eq="2" data-tall="1" data-h="214"></canvas></div>
        </div>
        <div class="eqcols">
          <sc-for list="{{ eqCols }}" as="c" hint-placeholder-count="5">
            <div class="eqcol eqcol--v eqcol--eq {{ c.cls }}">
              <span class="eqcol-name eqcol-name--down">{{ c.name }} <span class="eqcol-name-num">{{ c.range }}</span></span>
              <div class="eqcol-vbody">
                <div class="eqcol-vtop"><button type="button" class="eq-band-power {{ c.onCls }}"><span class="eq-band-lamp"></span></button></div>
                <div class="eqcol-knobs eqcol-knobs--floor">
                  <sc-if value="{{ c.hasKnobs }}" hint-placeholder-val="{{ true }}">
                    <div class="knob" style="gap:3px"><div class="knob-cap"><canvas class="knob-face" data-knob="1" data-size="40" data-min="20" data-max="20000" data-curve="log" data-val="{{ c.f }}"></canvas></div><div class="knob-label">Freq</div></div>
                    <div class="knob" style="gap:3px"><div class="knob-cap"><canvas class="knob-face" data-knob="1" data-size="40" data-min="-18" data-max="18" data-val="{{ c.g }}"></canvas></div><div class="knob-label">Gain</div></div>
                    <div class="knob" style="gap:3px"><div class="knob-cap"><canvas class="knob-face" data-knob="1" data-size="40" data-min="0.1" data-max="10" data-curve="log" data-val="{{ c.q }}"></canvas></div><div class="knob-label">Q</div></div>
                  </sc-if>
                </div>
                <canvas class="eqcol-glyph" data-glyph="{{ c.glyph }}"></canvas>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

<!-- Canvas draw calls this unit relies on (from the page logic): eq(cv, w, h) for canvas[data-eq] (data-h="214"), knob(...) for canvas[data-knob], glyph(cv, kind) for canvas.eqcol-glyph. Section list (eqCols) rendered via sc-for: name, range, cls, onCls, hasKnobs, f, g, q, glyph. -->

<!-- Data + drawing (JS) -->
<script>
// section list rendered by the sc-for
    const eqCols = [
      { name: 'Lo cut', range: '30 Hz', glyph: 'locut', cls: 'eqcol--cut is-off', onCls: '', hasKnobs: false },
      { name: 'Lo shelf', range: '30–400', glyph: 'loshelf', cls: '', onCls: 'is-on', hasKnobs: true, f: 110, g: 0, q: 0.7 },
      { name: 'Param 1', range: '39–20k', glyph: 'bell', cls: '', onCls: 'is-on', hasKnobs: true, f: 260, g: 0, q: 1 },
      { name: 'Param 2', range: '39–20k', glyph: 'bell', cls: '', onCls: 'is-on', hasKnobs: true, f: 4500, g: 0, q: 1 },
      { name: 'Hi shelf', range: '3k–12k', glyph: 'hishelf', cls: '', onCls: 'is-on', hasKnobs: true, f: 8000, g: 0, q: 0.7 },
    ];

// helpers
  fit(cv, w, h) {
    const dpr = window.devicePixelRatio || 1, W = Math.round(w * dpr), H = Math.round(h * dpr);
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    cv.style.height = h + 'px';
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return ctx;
  }
clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
lerp(a, b, t) { return a + (b - a) * t; }

  /* ---- knob.js paint ---- */
  knob(cv) {
    const S = +cv.dataset.size, min = +cv.dataset.min, max = +cv.dataset.max, val = +cv.dataset.val, log = cv.dataset.curve === 'log';
    const ctx = this.fit(cv, S, S); cv.style.width = S + 'px'; ctx.clearRect(0, 0, S, S);
    const toNorm = (v) => log ? (Math.log(v) - Math.log(min)) / (Math.log(max) - Math.log(min)) : (v - min) / (max - min);
    const A0 = Math.PI * 0.75, A1 = Math.PI * 2.25, cx = S / 2, cy = S / 2, rArc = S * 0.46, rCap = S * 0.335;
    const ang = this.lerp(A0, A1, toNorm(val));
    ctx.lineCap = 'butt'; ctx.lineWidth = Math.max(2, S * 0.055); ctx.strokeStyle = 'rgba(78,80,73,0.55)'; ctx.beginPath(); ctx.arc(cx, cy, rArc, A0, A1); ctx.stroke();
    const rim = ctx.createLinearGradient(cx - rCap, cy - rCap, cx + rCap, cy + rCap); rim.addColorStop(0, '#6d6f66'); rim.addColorStop(0.42, '#32342f'); rim.addColorStop(1, '#141513');
    ctx.fillStyle = rim; ctx.beginPath(); ctx.arc(cx, cy, rCap * 1.18, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
    for (let i = 0; i < 32; i++) { const a = i / 32 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * rCap * 1.02, cy + Math.sin(a) * rCap * 1.02); ctx.lineTo(cx + Math.cos(a) * rCap * 1.18, cy + Math.sin(a) * rCap * 1.18); ctx.stroke(); }
    ctx.restore();
    const face = ctx.createRadialGradient(cx - rCap * 0.4, cy - rCap * 0.45, rCap * 0.05, cx, cy, rCap * 1.25); face.addColorStop(0, '#4a4c45'); face.addColorStop(0.55, '#2a2c27'); face.addColorStop(1, '#171815');
    ctx.fillStyle = face; ctx.beginPath(); ctx.arc(cx, cy, rCap, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, rCap, 0, Math.PI * 2); ctx.stroke();
    ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = Math.max(1.6, S * 0.045); ctx.strokeStyle = '#0c0d0b'; ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang) * rCap * 0.18, cy + Math.sin(ang) * rCap * 0.18); ctx.lineTo(cx + Math.cos(ang) * rCap * 0.86, cy + Math.sin(ang) * rCap * 0.86); ctx.stroke();
    ctx.lineWidth = Math.max(1, S * 0.026); ctx.strokeStyle = '#e8d5a8'; ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang) * rCap * 0.2, cy + Math.sin(ang) * rCap * 0.2); ctx.lineTo(cx + Math.cos(ang) * rCap * 0.84, cy + Math.sin(ang) * rCap * 0.84); ctx.stroke(); ctx.restore();
  }

  /* ---- EQ curve (B3) ---- */
  fToT(f) { const F0 = Math.log10(20), F1 = Math.log10(22050); return (Math.log10(this.clamp(f, 20, 22050)) - F0) / (F1 - F0); }
  eq(cv, w, H) {
    const ctx = this.fit(cv, w, H); ctx.fillStyle = '#07080a'; ctx.fillRect(0, 0, w, H);
    const padB = 15, plotH = H - padB, yOf = (db) => plotH / 2 - db / 18 * (plotH / 2 - 6);
    ctx.font = '500 9px "Spline Sans Mono", Menlo, monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'center';
    for (const f of [50, 100, 500, 1000, 5000, 10000, 20000]) { const x = this.fToT(f) * w; ctx.fillStyle = 'rgba(78,80,73,0.35)'; ctx.fillRect(x, 0, 1, plotH); ctx.fillStyle = '#6e7067'; ctx.fillText(f >= 1000 ? f / 1000 + 'k' : String(f), this.clamp(x, 12, w - 12), plotH + 3); }
    for (const d of [-12, -6, 0, 6, 12]) { const y = Math.round(yOf(d)) + 0.5; ctx.fillStyle = d === 0 ? 'rgba(168,137,78,0.5)' : 'rgba(78,80,73,0.22)'; ctx.fillRect(0, y, w, 1); if (H > 140 && d !== 0) { ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#5c5e56'; ctx.fillText((d > 0 ? '+' : '−') + Math.abs(d) + ' dB', 4, y - 2); } }
    ctx.beginPath(); ctx.moveTo(0, yOf(0) + 0.5); ctx.lineTo(w, yOf(0) + 0.5); ctx.strokeStyle = '#ffcf8a'; ctx.lineWidth = 1.6; ctx.stroke();
    [110, 260, 1200, 4500, 8000].forEach((f, i) => { const x = this.fToT(f) * w, y = yOf(0), sel = i === 2; ctx.beginPath(); ctx.arc(x, y, sel ? 6 : 5, 0, Math.PI * 2); ctx.fillStyle = sel ? '#ffb454' : '#1c1e1a'; ctx.fill(); ctx.strokeStyle = '#ffb454'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.fillStyle = sel ? '#ffe0ab' : '#d8b877'; ctx.textBaseline = 'bottom'; ctx.fillText(String(i + 1), x, y - 8); });
  }

  /* ---- filter-shape glyphs, engraved ---- */
  glyph(cv, kind) {
    const w = 22, h = 14, ctx = this.fit(cv, w, h); ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#9a9c92'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath();
    if (kind === 'locut') { ctx.moveTo(2, 12); ctx.lineTo(8, 4); ctx.lineTo(20, 4); }
    else if (kind === 'loshelf') { ctx.moveTo(2, 4); ctx.lineTo(8, 4); ctx.lineTo(13, 9); ctx.lineTo(20, 9); }
    else if (kind === 'hishelf') { ctx.moveTo(2, 9); ctx.lineTo(9, 9); ctx.lineTo(14, 4); ctx.lineTo(20, 4); }
    else if (kind === 'knee') { ctx.moveTo(2, 12); ctx.lineTo(10, 5); ctx.quadraticCurveTo(13, 2, 20, 2); }
